<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Z8 人工复核 · Forest Bird</title><link rel="stylesheet" href="/z8-review.css"><script src="/z8-review.js" defer></script></head>
<body data-panel="work">
<header><div class="brand"><span>◈</span><div><strong data-t="brand">Z8 人工复核</strong><small>FOREST BIRD · 384 × 256</small></div></div><div id="progress" class="muted">—</div><span id="saveState" role="status">—</span><label class="actor"><span data-t="actor">复核者</span><input id="actor" maxlength="80" value="reviewer-local"></label><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select><button id="export" data-t="export">导出记录</button><button id="dedupeManage" data-t="dedupeManage">去重管理</button><button id="dedupe" data-t="dedupe">去重</button><button id="help" data-t="help">帮助</button><button id="logout" data-t="logout" hidden>退出登录</button></header>
<nav id="mobileNav" aria-label="标注面板"><button data-panel="queue" data-t="imagesPanel">图片</button><button data-panel="work" data-t="editPanel" class="active">标注</button><button data-panel="properties" data-t="detailsPanel">框与记录</button></nav>
<main><aside class="queue"><input id="search" data-ph="search" placeholder="搜索编号"><select id="filter"><option value="all" data-t="all">全部</option><option value="todo" data-t="todo">未确认</option><option value="correct" data-t="correct">原厂正确</option><option value="partial_error" data-t="partial_error">原厂部分有误</option><option value="error" data-t="error">原厂有误</option><option value="needs_adjudication" data-t="uncertain">待确认</option><option value="duplicates" data-t="duplicates">重复</option><option value="zero" data-t="zero">原厂无框</option></select><div id="queueCount" class="muted"></div><div id="queue"></div><button id="more" data-t="more">显示更多</button></aside>
<section class="work"><div class="title-row"><div><h1 id="imageTitle">—</h1><div id="imageMeta" class="muted">—</div></div><button id="previous" data-t="previous">← 上一张</button><button id="next" data-t="next">下一张 →</button></div>
<div id="notice" class="notice" hidden role="alert"></div>
<div class="toolbar"><button data-tool="select" class="active" data-t="select">V 选择 / 调框</button><button data-tool="pan" data-t="panTool">移动画面</button><button data-tool="bird" data-t="drawBird">B 鸟框</button><button data-tool="head" data-t="drawHead">H 头框</button><button data-tool="eye" data-t="drawEye">E 眼点</button><button data-tool="eye_box" data-t="drawEyeBox">R 眼框</button><button data-tool="uncertain" data-t="drawUncertain">U 疑似框</button><button id="delete" data-t="delete">删除选中</button><button id="clearAll" data-t="clearAll">清空所有框</button><button id="undo" data-t="undo">撤销</button><button id="redo" data-t="redo">重做</button></div>
<div class="viewbar"><label><input id="showZ8" type="checkbox" checked><span data-t="showZ8">显示 Z8 / 纠正框</span></label><label><input id="showBaseline" type="checkbox"><span data-t="showBaseline">叠加原厂基线</span></label><label><input id="continuous" type="checkbox" checked><span data-t="continuous">连续标注 B → H → E</span></label><button id="zoomOut" aria-label="缩小 / Zoom out">−</button><button id="zoomIn" aria-label="放大 / Zoom in">＋</button><button id="fit" data-t="fit">适应全图</button><span id="zoomText" class="muted"></span><button id="reference" data-t="reference">查看原图参考</button></div>
<div id="stage"><svg id="canvas" viewBox="0 0 384 256" preserveAspectRatio="xMidYMid meet" tabindex="0" role="img" aria-label="Z8 input and editable proposals"><image id="canvasImage" x="0" y="0" width="384" height="256"></image><g id="baseline"></g><g id="shapes"></g><g id="preview"></g></svg><div id="imageLoading" data-t="loading">正在载入图片…</div></div>
<canvas id="touchLoupe" width="144" height="144" hidden aria-hidden="true"></canvas>
<div class="canvas-footer"><span id="hint" data-t="hint">拖动框或四角修改；滚轮缩放，空格拖动平移。</span><span id="coordinates">—</span></div>
<div class="bottom"><div id="decisionPreview"></div><div class="actions"><button id="dedupeQuick" data-t="repeatPrevious">与上一张重复</button><button id="noBird" data-t="noBird">确认无鸟</button><button id="uncertain" data-t="uncertainNext">不确定并下一张</button><button id="confirm" class="primary" data-t="confirm">确认并下一张 →</button></div></div>
</section>
<aside class="properties"><h2 data-t="changes">本图记录</h2><div id="summary"></div><label><span data-t="presence">画面内容</span><select id="presence"><option value="" data-t="unassessed">未判断</option><option value="present" data-t="present">有鸟</option><option value="absent" data-t="absent">无鸟</option><option value="uncertain" data-t="presenceUncertain">疑似 / 不确定</option></select></label><h3 data-t="shapesTitle">框与眼点</h3><div id="items"></div><div id="geometry"></div><label><span data-t="notes">备注</span><textarea id="notes" rows="4" data-ph="notesPlaceholder" placeholder="漏了哪只鸟、哪个部位被遮挡…"></textarea></label><div class="actions"><button id="restore" data-t="restore">恢复 Z8 原框</button><button id="history" data-t="history">修订历史</button></div><p class="muted small" data-t="auxHelp">slot 5 是辅助区域，不会自动转成鸟身类别。记录修改位置和部位，原厂输出始终保留。</p></aside></main>
<dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="closeDialog">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
